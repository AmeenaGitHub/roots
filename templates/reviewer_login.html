{% extends "base.html" %}
{% block title %}Reviewer login{% endblock %}
{% block content %}
<h1>Reviewer login</h1>
<p class="muted">For authorised reviewers who approve, correct or remove records.</p>
<form method="post" class="form">
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
